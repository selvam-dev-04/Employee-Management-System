<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>EMS</h2>
            <a href="/">Dashboard</a>
            <a href="/employees" class="active">Employees</a>
            <a href="/add-employee">Add Employee</a>
        </div>

        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1>Update Employee</h1>
                    <p>Modify existing employee information</p>
                </div>
            </div>

            <div class="form-container">

                <form action="/update" method="post">

                    <input type="hidden" name="id"
                           th:value="${employee.id}">

                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text"
                               th:value="${employee.id}" disabled>
                    </div>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name"
                               th:value="${employee.name}" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email"
                               th:value="${employee.email}" required>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" name="department"
                               th:value="${employee.department}" required>
                    </div>

                    <div class="form-group">
                        <label>Salary</label>
                        <input type="number" name="salary"
                               step="0.01" min="1"
                               th:value="${employee.salary}" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="save-btn">
                            Update Employee
                        </button>

                        <a href="/employees" class="cancel-btn">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
