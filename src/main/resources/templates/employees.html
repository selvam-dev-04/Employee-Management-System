<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Details</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>EMS</h2>
            <a href="/">Dashboard</a>
            <a href="/employees" class="active">Employees</a>
            <a href="/add-employee">Add Employee</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1>Employee Details</h1>
                    <p>Manage your employee records</p>
                </div>

                <a href="/add-employee" class="add-btn">
                    + Add New Employee
                </a>
            </div>
            <div class="search-container">
   				 <form action="/search" method="get">
        			<input type="text" name="name" placeholder="Search employee by name..." required>
        			<button type="submit">Search</button>
			    </form>
			</div>
			
			
		<div class="sort-container">
    		<form action="/employees" method="get">

        			<label>Sort By:</label>

        			<select name="sortBy">
            			<option value="id" th:selected="${selectedSort == 'id'}">Employee ID</option>
            			<option value="name" th:selected="${selectedSort == 'name'}">Name</option>
            			<option value="department" th:selected="${selectedSort == 'department'}">Department</option>
            			<option value="salary" th:selected="${selectedSort == 'salary'}">Salary</option>
        			</select>

        			<select name="direction">
            			<option value="asc" th:selected="${selectedDirection == 'asc'}">Ascending</option>
            			<option value="desc" th:selected="${selectedDirection == 'desc'}">Descending</option>
        			</select>

        			<button type="submit">Sort</button>

    			</form>
			</div>

            <!-- Employee Table -->
            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="emp : ${employees}">
                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.name}"></td>
                            <td th:text="${emp.email}"></td>
                            <td>
                                <span class="department"
                                      th:text="${emp.department}">
                                </span>
                            </td>
                            <td th:text="${emp.salary}"></td>

                            <td>
                                <div class="action-buttons">
                                    <a th:href="@{/edit/{id}(id=${emp.id})}"
                                       class="edit-btn">Edit</a>

                                    <a th:href="@{/delete/{id}(id=${emp.id})}"
                                       class="delete-btn"
                                       onclick="return confirm('Are you sure you want to delete this employee?')">
                                        Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <a href="/" class="back-link">← Back to Dashboard</a>

        </div>
    </div>

</body>
</html>
